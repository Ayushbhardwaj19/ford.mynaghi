   <style>

      :root {
         --navy: #00095b;
         --btn: #0b5fe6;
         --ink: #1d1d1d;
         --pad: clamp(20px, 7vw, 104px)
      }

      * {
         box-sizing: border-box;
         margin: 0;
         padding: 0
      }

      body {
         font-family: "FordAntenna", "Ford Antenna", "Segoe UI", Helvetica, Arial, sans-serif;
         color: var(--navy);
         background: #fff;
         -webkit-font-smoothing: antialiased
      }

      a {
         color: inherit;
         text-decoration: none
      }

      button {
         font: inherit;
         cursor: pointer;
         border: 0
      }

      :focus-visible {
         outline: 3px solid var(--btn);
         outline-offset: 3px
      }

      /* ---------- header ---------- */
      header {
         display: grid;
         grid-template-columns: 1fr auto 1fr;
         align-items: center;
         height: 96px;
         padding: 0 44px;
         background: #fff;
         position: sticky;
         top: 0;
         z-index: 20
      }

      .nav {
         display: flex;
         gap: 34px;
         font-weight: 700;
         font-size: 19px;
         letter-spacing: .2px
      }

      .nav a:hover {
         text-decoration: underline;
         text-underline-offset: 6px
      }

      .logo {
         display: block;
         width: 104px
      }

      .logo img {
         width: 100%;
         display: block
      }

      .right {
         display: flex;
         align-items: center;
         justify-content: flex-end;
         gap: 36px;
         color: #000
      }

      .dealer {
         font-size: 13px;
         font-weight: 700;
         line-height: 1.25;
         text-align: right
      }

      .dealer .ar {
         display: block;
         font-size: 12px;
         font-weight: 600
      }

      .burger {
         display: none;
         background: none;
         color: var(--navy)
      }

      /* ---------- category sections ---------- */
      .cat {
         padding: 64px var(--pad) 60px
      }

      .cat h2 {
         font-size: clamp(38px, 4.6vw, 60px);
         font-weight: 400;
         line-height: 1.1;
         margin: 0 0 34px 10px;
         color: var(--navy)
      }

      .row {
         display: grid;
         grid-template-columns: repeat(4, 1fr);
         align-items: start
      }

      .v {
         padding-right: 18px;
         display: flex;
         flex-direction: column;
         align-items: flex-start
      }

      .v .pic {
         width: 100%;
         height: 230px;
         display: flex;
         align-items: center;
         justify-content: center;
         margin-bottom: 22px
      }

      .v .pic img {
         max-width: 100%;
         max-height: 100%;
         object-fit: contain;
         display: block
      }

      .v .pic svg {
         width: 92%;
         opacity: .8
      }

      .v h3 {
         font-size: clamp(26px, 2.9vw, 38px);
         font-weight: 400;
         line-height: 1.28;
         color: var(--navy);
         margin-bottom: 22px;
         min-height: 2.56em
      }

      .v .btn {
         background: var(--btn);
         color: #fff;
         border-radius: 999px;
         padding: 17px 36px;
         font-size: 18px;
         font-weight: 600;
         letter-spacing: .2px;
         transition: filter .15s
      }

      .v .btn:hover {
         filter: brightness(.9)
      }

      .v.empty {
         visibility: hidden
      }

      .pager {
         display: flex;
         justify-content: center;
         align-items: center;
         gap: 14px;
         margin-top: 46px;
         color: #2d3340;
         font-size: 22px
      }

      .pager button {
         width: 48px;
         height: 48px;
         border-radius: 50%;
         display: grid;
         place-items: center;
         background: #555;
         color: #fff
      }

      .pager button:disabled {
         background: #a9a9a9;
         cursor: default
      }

      .pager svg {
         width: 22px;
         height: 22px;
         fill: none;
         stroke: #fff;
         stroke-width: 2.6;
         stroke-linecap: round;
         stroke-linejoin: round
      }

      footer {
         background: var(--navy);
         color: #c9cdea;
         padding: 40px var(--pad);
         font-size: 14px;
         display: flex;
         justify-content: space-between;
         gap: 20px;
         flex-wrap: wrap
      }

      footer a:hover {
         text-decoration: underline
      }

      .toast {
         position: fixed;
         left: 50%;
         bottom: 24px;
         transform: translate(-50%, 40px);
         background: var(--navy);
         color: #fff;
         padding: 13px 24px;
         border-radius: 999px;
         opacity: 0;
         transition: .3s;
         z-index: 50;
         font-size: 15px;
         pointer-events: none
      }

      .toast.show {
         transform: translate(-50%, 0);
         opacity: 1
      }

      @media(max-width:1000px) {
         .row {
            grid-template-columns: repeat(2, 1fr);
            row-gap: 30px
         }

         .nav {
            gap: 20px;
            font-size: 16px
         }

         .dealer {
            display: none
         }
      }

      @media(max-width:700px) {
         header {
            grid-template-columns: auto 1fr auto;
            padding: 0 18px;
            height: 76px
         }

         .nav {
            display: none
         }

         .burger {
            display: block
         }

         .nav.open {
            display: flex;
            flex-direction: column;
            position: absolute;
            top: 76px;
            left: 0;
            right: 0;
            background: #fff;
            padding: 10px 24px 20px;
            gap: 18px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, .1)
         }

         .logo {
            width: 100px;
            justify-self: center;
            grid-column: 2
         }

         .row {
            grid-template-columns: 1fr 1fr
         }

         .v .pic {
            height: 140px
         }

         .v .btn {
            padding: 13px 22px;
            font-size: 15px
         }
      }

      @media(prefers-reduced-motion:reduce) {
         * {
            transition: none !important
         }
      }

      function drawCat(ci) {
         var cat = CATS[ci], pg = page[ci] || 0, pages = Math.ceil(cat.items.length / PER);
         var slice = cat.items.slice(pg * PER, pg * PER + PER);
         var html = slice.map(function (it) { return card(cat, it) }).join("");
         for (var i = slice.length; i < PER; i++)html += '<div class="v empty"></div>';
         var el = document.getElementById("cat" + ci);
         el.querySelector(".row").innerHTML = html;
         var pg_ = el.querySelector(".pager");
         if (pages > 1) {
            pg_.style.display = "flex";
            pg_.querySelector(".prev").disabled = pg === 0;
            pg_.querySelector(".next").disabled = pg === pages - 1;
            pg_.querySelector(".num").textContent = (pg + 1) + " / " + pages;
         } else pg_.style.display = "none";
         el.querySelectorAll("img[data-fb]").forEach(function (im) { im.onerror = function () { im.outerHTML = '<svg viewBox="0 0 300 110">' + SIL[im.dataset.fb] + '</svg>' } });
      }

      var CH = '<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>', CR = '<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>';
      $("#sections").innerHTML = CATS.map(function (c, i) {
         return '<section class="cat" id="cat' + i + '" data-category="' + c.name + '"><h2>' + c.name + '</h2><div class="row"></div>' +
            '<div class="pager"><button class="prev" aria-label="Previous">' + CH + '</button><span class="num"></span><button class="next" aria-label="Next">' + CR + '</button></div></section>';
      }).join("");
      CATS.forEach(function (c, i) { page[i] = 0; drawCat(i) });

      document.addEventListener("click", function (e) {
         var b = e.target.closest(".btn");
         if (b) { track("product_view", { id: b.dataset.id, name: b.dataset.name, category: b.dataset.cat }); toast(b.dataset.name + " (demo page)"); return }
         var p = e.target.closest(".pager button");
         if (p && !p.disabled) {
            var sec = p.closest(".cat"), ci = +sec.id.replace("cat", "");
            page[ci] += p.classList.contains("next") ? 1 : -1; drawCat(ci);
            track("carousel_page", { category: CATS[ci].name, page: page[ci] + 1 });
         }
      });
      $("#burger").onclick = function () { $("#nav").classList.toggle("open") };

      var logo = $("#logoImg"); logo.src = LOGO || FORD_SVG;
      logo.onerror = function () { logo.onerror = null; logo.src = FORD_SVG };
      track("page_view", { page: "vehicles" });
   </script>
